<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container text-center py-3">
            <h1 class="header-title m-0">HTML, CSS Y JAVASCRIPT</h1>
            <p class="header-subtitle m-0">Gestión interactiva de listas</p>
        </div>
    </header>

    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center g-4">
            
            <!-- Columna del Formulario -->
            <div class="col-12 col-md-5 col-lg-4">
                <!-- Formulario Agregar -->
                <div class="card shadow-sm border-0 form-card" id="card-agregar">
                    <div class="card-header bg-success text-white py-3">
                        <h5 class="card-title m-0 d-flex align-items-center gap-2">
                            <i class="bi bi-person-plus-fill"></i> Agregar Persona
                        </h5>
                    </div>
                    <div class="card-body p-3 p-md-4">
                        <form id="form-agregar">
                            <div class="mb-3">
                                <label for="nuevaPersona" class="form-label text-secondary fw-semibold">Nombre y Apellido</label>
                                <input type="text" maxlength="30" id="nuevaPersona" class="form-control form-control-lg" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 d-flex align-items-center justify-content-center gap-2 shadow-sm" id="agregar">
                                <i class="bi bi-plus-circle"></i> Agregar
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Formulario Editar -->
                <div class="card shadow-sm border-0 form-card" id="card-editar" hidden>
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title m-0 d-flex align-items-center gap-2">
                            <i class="bi bi-pencil-square"></i> Modificar Persona
                        </h5>
                    </div>
                    <div class="card-body p-3 p-md-4">
                        <form id="form-editar">
                            <div class="mb-3">
                                <label for="editarPersona" class="form-label text-secondary fw-semibold">Editar Nombre y Apellido</label>
                                <input type="text" maxlength="30" id="editarPersona" class="form-control form-control-lg" required>
                            </div>
                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <button type="submit" class="btn btn-primary btn-lg flex-fill d-flex align-items-center justify-content-center gap-2 shadow-sm" id="btnModificar">
                                    <i class="bi bi-check-circle"></i> Guardar
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-lg flex-fill d-flex align-items-center justify-content-center gap-2" id="btnCancelar">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna de la Lista -->
            <div class="col-12 col-md-7 col-lg-6">
                <div class="card shadow-sm border-0 list-card h-100">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="card-title m-0 text-dark fw-bold d-flex align-items-center gap-2">
                            <i class="bi bi-people-fill text-primary"></i> Personas Registradas
                        </h5>
                        <span class="badge bg-primary rounded-pill px-3 py-2" id="contador-personas">0</span>
                    </div>
                    <div class="card-body p-3 p-md-4">
                        <ul id="personas" class="list-unstyled m-0 d-flex flex-column gap-2">
                            <!-- Los elementos se cargan dinámicamente con JavaScript -->
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="main-footer py-3 text-center text-secondary">
        <div class="container">
            <p class="m-0 fw-semibold">Eduardo Lazarte &copy; 2026</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Script de la aplicación -->
    <script src="app.js"></script>    
</body>
</html>
